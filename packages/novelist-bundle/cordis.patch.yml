# The AI Web Novel Composer bundle patch.
#
# This file is the bundle (declared by `dsh.bundle.patch` in package.json): a
# profile that installs this package gets it appended to `dsh.profile.bundles`,
# which composes it over the layers before it — after `@deepseek-ai/dsh-base`
# and `@deepseek-ai/dsh-web-app` for the web profile.
#
# A patch is a top-level array of entries. This one only INSERTS rows; it never
# overrides an existing id, so it cannot change how the base or web layers
# behave. Everything it adds is the composer's own row plus, when the web
# surface is present, that row's browser half (discovered automatically through
# the package's `dsh.client` declaration — no row is needed for it).
#
# Row fields: `id` must be unique across the composed tree; `name` is a module
# specifier resolved from the dsh installation first and then from the profile's
# own node_modules, which is where an out-of-tree plugin lands.

- insert:
    # The host half: provides the `novelState` service and registers the eight
    # computing `novel_*` tools on `ctx.tools`, plus `novel_review` when the
    # profile has a model route. `workspaceRoot` defaults to the agent's working
    # directory; set it here to pin one project directory instead:
    #
    #   config:
    #     workspaceRoot: /Users/me/novels/qingyun
    #     reviewProvider: deepseek
    #     reviewModel: deepseek-chat
    #
    - id: ai-novelist
      name: '@ai-novelist/novelist-skill'
